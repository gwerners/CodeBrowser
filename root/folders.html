<!DOCTYPE html>
<!--%lua% if theme == "dark" then print('<html lang="en" class="dark">') else print('<html lang="en">') end %lua%-->
<head>
  <meta charset="UTF-8">
  <title>CodeBrowser Folder View</title>
<!--%lua%
print("  <script src=\"" .. serverUrl .. "/files/app.js\"></script>\n")
print("  <link rel=\"stylesheet\" href=\"" .. serverUrl .. "/files/style.css\">\n")
%lua%-->
</head>
<body>
  <div id="page">
    <div id="whole_header">
      <div id="Masthead">
<!--%lua%
local str_upper_path = "&path=" .. upperPath
print("        Contents of <a href=\"" .. serverUrl .. "/folders?project=" .. project .. str_upper_path .. "\">" .. project .. "/" .. path .. "</a>\n")
%lua%-->
        (Results <b id="revCount">0</b>)
      </div>
      <form action="#">
        <div id="bar">
          <ul>
<!--%lua%
print("            <li><a href=\"" .. serverUrl .. "\">Home</a></li>\n")
print("            <li><a href=\"" .. serverUrl .. "/history?project=" .. project .. "&path=" .. path .. "\">History</a></li>\n")
%lua%-->
          </ul>
        </div>
      </form>
    </div>

    <div id="content">
      <table class="src" id="revisions">
        <thead>
          <tr>
            <th>Name</th>
            <th>Date</th>
            <th>Size</th>
            <th>Type</th>
          </tr>
        </thead>
        <tbody id="rev-body"></tbody>
      </table>
    </div>

    <div id="footer">
<!--%lua%
print("      <p><a href=\"" .. githubUrl .. "\" title=\"Served by " .. serverName .. "\"><span id=\"fti\"></span></a></p>\n")
print("      <p>Indexes created " .. indexCreationTime .. "</p>\n")
%lua%-->
    </div>
  </div>

<script>
  const revisions = [
<!--%lua%
local files_info = get_file_info()
local comma = ""
for _, file_info in ipairs(files_info) do
  local type = file_info.isDir and "Directory" or "File"
  local url
  if file_info.path == nil or file_info.path == '' then
    url = serverUrl .. "/" .. file_info.type .. "?project=" .. project .. "&path=" .. file_info.name
  else
    url = serverUrl .. "/" .. file_info.type .. "?project=" .. project .. "&path=" .. file_info.path .. "/" .. file_info.name
  end
  print("    " .. comma .. "{ name: \"" .. file_info.name .. "\", date: \"" .. file_info.access_date .. "\", size: \"" .. file_info.size .. "\", type: \"" .. type .. "\", url: \"" .. url .. "\" }\n")
  comma = ","
end
%lua%-->
  ];

  document.getElementById("revCount").textContent = revisions.length;

  window.onload = () => {
    const tbody = document.getElementById("rev-body");
    revisions.forEach(rev => {
      const row = document.createElement("tr");
      row.innerHTML = `
        <td><a href="${rev.url}">${rev.name}</a></td>
        <td>${rev.date}</td>
        <td>${rev.size}</td>
        <td>${rev.type}</td>
      `;
      tbody.appendChild(row);
    });
  };
</script>
</body>
</html>
