<!DOCTYPE html>
<!--%lua% if theme == "dark" then print('<html lang="en" class="dark">') else print('<html lang="en">') end %lua%-->
<head>
  <meta charset="UTF-8">
  <title>CodeBrowser Folder Revision History</title>
<!--%lua%
print("  <script src=\"" .. serverUrl .. "/files/app.js\"></script>\n")
print("  <link rel=\"stylesheet\" href=\"" .. serverUrl .. "/files/style.css\">\n")
%lua%-->
</head>
<body>
  <div id="page">
    <div id="whole_header">
      <div id="Masthead">
<!--%lua%
print("        History of <a href=\"" .. serverUrl .. "/folders?project=" .. project .. "&path=" .. path .. "\">" .. project .. "/" .. path .. "</a>\n")
%lua%-->
        (Results <b id="revCount">0</b>)
      </div>
      <form action="#">
        <div id="bar">
          <ul>
<!--%lua%
print("            <li><a href=\"" .. serverUrl .. "\">Home</a></li>\n")
%lua%-->
          </ul>
        </div>
      </form>
    </div>

    <div id="content">
      <table class="src" id="revisions">
        <thead>
          <tr>
            <th>Revision</th>
            <th>Date</th>
            <th>Author</th>
            <th>Comments <div class="toggle-link-global" onclick="toggleAllFileLists(this)">(Show modified files >>>)</div></th>
          </tr>
        </thead>
        <tbody id="rev-body"></tbody>
      </table>
    </div>

    <div id="footer">
<!--%lua%
print("      <p><a href=\"" .. githubUrl .. "\" title=\"Served by " .. serverName .. "\"><span id=\"fti\"></span></a></p>\n")
print("      <p>Indexes created " .. indexCreationTime .. "</p>\n")
%lua%-->
    </div>
  </div>

<script>
  const revisions = [
<!--%lua%
if commits then
  local comma = ""
  for i = 1, #commits do
    local c = commits[i]
    print(comma .. "{\n")
    print("  rev: \"" .. c.hash .. "\",\n")
    print("  date: \"" .. c.date .. "\",\n")
    print("  author: \"" .. c.author .. "\",\n")
    print("  comment: \"" .. c.message .. "\",\n")
    print("  files: [\n")
    local fc = ""
    for j = 1, #c.files do
      print("    " .. fc .. "{ url: \"" .. serverUrl .. "/files?project=" .. project .. "&path=" .. c.files[j] .. "&hash=" .. c.hash .. "\", path: \"" .. c.files[j] .. "\" }\n")
      fc = ","
    end
    print("  ]\n")
    print("}\n")
    comma = ","
  end
end
%lua%-->
  ];

  document.getElementById("revCount").textContent = revisions.length;

  window.onload = () => {
    const tbody = document.getElementById("rev-body");
    revisions.forEach(rev => {
      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${rev.rev}</td>
        <td>${rev.date}</td>
        <td>${rev.author}</td>
        <td>
          <p class="rev-message-full">${rev.comment}</p>
          <div class="filelist-hidden" style="display: none;">
            ${rev.files.map(f => `<a href="${f.url}">${f.path}</a><br>`).join("")}
          </div>
        </td>
      `;
      tbody.appendChild(row);
    });
  };
</script>
</body>
</html>
