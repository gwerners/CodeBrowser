<!DOCTYPE html>
<!--%lua% if theme == "dark" then print('<html lang="en" class="dark">') else print('<html lang="en">') end %lua%-->
<head>
  <meta charset="UTF-8">
  <title>CodeBrowser Editor</title>
<!--%lua%
print("  <script src=\"" .. serverUrl .. "/files/app.js\"></script>\n")
print("  <script src=\"" .. serverUrl .. "/files/cytoscape.min.js\"></script>\n")
print("  <script src=\"" .. serverUrl .. "/files/graph.js\"></script>\n")
print("  <link rel=\"stylesheet\" href=\"" .. serverUrl .. "/files/style.css\">\n")
print("  <script src=\"" .. serverUrl .. "/monaco/min/vs/loader.js\"></script>\n")
%lua%-->
</head>
<body>
  <div id="page">
    <div id="whole_header">
      <div id="Masthead">
<!--%lua%
if (hash == nil or hash == '') then
  print("        Contents of <a href=\"" .. serverUrl .. "/folders?project=" .. project .. "&path=" .. upperPath .. "\">" .. project .. "/" .. path .. "</a>\n")
else
  print("        Contents of <a href=\"" .. serverUrl .. "/folders?project=" .. project .. "&path=" .. upperPath .. "\">" .. project .. "/" .. path .. "#" .. hash .. "</a>\n")
end
%lua%-->
      </div>
      <form action="#">
        <div id="bar">
          <ul>
<!--%lua%
print("            <li><a href=\"" .. serverUrl .. "\">Home</a></li>\n")
print("            <li><a href=\"" .. serverUrl .. "/history?project=" .. project .. "&path=" .. path .. "\">History</a></li>\n")
if (hash == nil or hash == '') then
  print("            <li><a href=\"" .. serverUrl .. "/annotate?project=" .. project .. "&path=" .. path .. "\">Annotate</a></li>\n")
else
  print("            <li><a href=\"" .. serverUrl .. "/annotate?project=" .. project .. "&path=" .. path .. "&hash=" .. hash .. "\">Annotate</a></li>\n")
end
print("            <li><a href=\"#\" onclick=\"toggleSymbolPanel(editorConfig.symbolsUrl); return false;\">Symbols</a></li>\n")
%lua%-->
          </ul>
        </div>
      </form>
    </div>

    <div id="editorContainer" style="display: flex; height: calc(100vh - 100px);">
      <div id="symbolPanel" style="display: none;"></div>
      <div id="symbolResizer" style="display: none;"></div>
      <div id="editor" style="flex: 1;"></div>
      <div id="graphResizer" style="display: none;"></div>
      <div id="graphPanel" style="display: none;">
        <div class="graph-header">
          <span class="graph-title">Graph</span>
          <button class="graph-close" onclick="hideGraph()">&times;</button>
        </div>
        <div class="graph-canvas"></div>
        <div class="graph-tooltip"></div>
      </div>
    </div>

    <div id="footer">
<!--%lua%
print("      <p><a href=\"" .. githubUrl .. "\" title=\"Served by " .. serverName .. "\"><span id=\"fti\"></span></a></p>\n")
print("      <p>Indexes created " .. indexCreationTime .. "</p>\n")
%lua%-->
    </div>
  </div>

  <script>
<!--%lua%
local h = hash or ''
print("    var editorConfig = {\n")
print("      monacoPath: '" .. serverUrl .. "/monaco/min/vs',\n")
print("      fileUrl: '" .. serverUrl .. "/bin?project=" .. project .. "&path=" .. path .. "&hash=" .. h .. "',\n")
print("      identifierUrl: '" .. serverUrl .. "/identifier?project=" .. project .. "&path=" .. path .. "',\n")
print("      hoverUrl: '" .. serverUrl .. "/hover?project=" .. project .. "&path=" .. path .. "',\n")
print("      searchUrl: '" .. serverUrl .. "/search?project=" .. project .. "&path=" .. path .. "',\n")
print("      headerSourceUrl: '" .. serverUrl .. "/header_source?project=" .. project .. "&path=" .. path .. "',\n")
print("      symbolsUrl: '" .. serverUrl .. "/symbols?project=" .. project .. "&path=" .. path .. "',\n")
print("      callersUrl: '" .. serverUrl .. "/callers?project=" .. project .. "&path=" .. path .. "',\n")
print("      calleesUrl: '" .. serverUrl .. "/callees?project=" .. project .. "&path=" .. path .. "',\n")
print("      basesUrl:   '" .. serverUrl .. "/bases?project="   .. project .. "&path=" .. path .. "',\n")
print("      derivedUrl: '" .. serverUrl .. "/derived?project=" .. project .. "&path=" .. path .. "',\n")
print("      membersUrl: '" .. serverUrl .. "/members?project=" .. project .. "&path=" .. path .. "',\n")
print("      lineNumber: " .. line .. ",\n")
print("      lang: '" .. suffix .. "',\n")
print("    };\n")
%lua%-->

    fetch(editorConfig.fileUrl)
      .then(response => response.text())
      .then(content => {
        initMonacoEditor(
          document.getElementById('editor'),
          content,
          editorConfig.lang,
          editorConfig.lineNumber,
          editorConfig
        );
      })
      .catch(error => console.error('Error loading file:', error));

    initGraphPanel(
      document.getElementById('graphPanel'),
      document.getElementById('graphResizer')
    );
  </script>
</body>
</html>
