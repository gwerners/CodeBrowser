<!DOCTYPE html>
<!--%lua% if theme == "dark" then print('<html lang="en" class="dark">') else print('<html lang="en">') end %lua%-->
<head>
  <meta charset="UTF-8">
  <title>CodeBrowser File Revision History</title>
<!--%lua%
print("  <script src=\"" .. serverUrl .. "/files/app.js\"></script>\n")
print("  <link rel=\"stylesheet\" href=\"" .. serverUrl .. "/files/style.css\">\n")
%lua%-->
</head>
<body>
  <div id="page">
    <div id="whole_header">
      <div id="Masthead">
<!--%lua%
print("        Revision History of <a href=\"" .. serverUrl .. "/files?project=" .. project .. "&path=" .. path .. "\">" .. project .. "/" .. path .. "</a>\n")
%lua%-->
        (Results <b id="revCount">0</b>)
      </div>
      <form action="#">
        <div id="bar">
          <ul>
<!--%lua%
print("            <li><a href=\"" .. serverUrl .. "\">Home</a></li>\n")
print("            <li><a href=\"" .. serverUrl .. "/files?project=" .. project .. "&path=" .. path .. "\">Original</a></li>\n")
print("            <li><a href=\"" .. serverUrl .. "/annotate?project=" .. project .. "&path=" .. path .. "\">Annotate</a></li>\n")
%lua%-->
          </ul>
        </div>
      </form>
    </div>

    <form id="compareForm" action="/diff" method="get">
<!--%lua%
print("      <input type=\"hidden\" name=\"path\" value=\"" .. path .. "\">\n")
print("      <input type=\"hidden\" name=\"project\" value=\"" .. project .. "\">\n")
%lua%-->
      <table class="src" id="revisions">
        <thead>
          <tr>
            <th>Revision</th>
            <th>Compare</th>
            <th>Date</th>
            <th>Author</th>
            <th>Comments</th>
          </tr>
        </thead>
        <tbody id="revTable"></tbody>
      </table>
      <input type="submit" value="Compare">
    </form>

    <div id="footer">
<!--%lua%
print("      <p><a href=\"" .. githubUrl .. "\" title=\"Served by " .. serverName .. "\"><span id=\"fti\"></span></a></p>\n")
print("      <p>Indexes created " .. indexCreationTime .. "</p>\n")
%lua%-->
    </div>
  </div>

<script>
  const revisions = [
<!--%lua%
if commits then
  local comma = ""
  for i = 1, #commits do
    local c = commits[i]
    print(comma .. "{ id: \"" .. c.hash .. "\", date: \"" .. c.date .. "\", author: \"" .. c.author .. "\", comment: \"" .. c.message .. "\", url: \"" .. serverUrl .. "/files?project=" .. project .. "&path=" .. path .. "&hash=" .. c.hash .. "\" }\n")
    comma = ","
  end
end
%lua%-->
  ];

  const tbody = document.getElementById("revTable");
  document.getElementById("revCount").textContent = revisions.length;

  revisions.forEach(rev => {
    const row = document.createElement("tr");
    row.innerHTML = `
      <td><a href="${rev.url}">#${rev.id}</a></td>
      <td>
        <input type="radio" name="r1" value="${rev.id}">
        <input type="radio" name="r2" value="${rev.id}">
      </td>
      <td>${rev.date}</td>
      <td>${rev.author}</td>
      <td><p class="rev-message-full">${rev.comment}</p></td>
    `;
    tbody.appendChild(row);
  });

  applyRadioLogic();
</script>
</body>
</html>
