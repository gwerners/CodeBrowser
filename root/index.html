<!DOCTYPE html>
<!--%lua% if theme == "dark" then print('<html lang="en" class="dark">') else print('<html lang="en">') end %lua%-->
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="nofollow">
  <title>CodeBrowser Search</title>
<!--%lua%
print("  <script src=\"" .. serverUrl .. "/files/app.js\"></script>\n")
print("  <link rel=\"stylesheet\" href=\"" .. serverUrl .. "/files/style.css\">\n")
%lua%-->
</head>
<body>
  <div id="page">
    <div id="sbar">
      <form id="sbox" action="search">
        <div id="qtbl">
          <table>
            <tr>
              <td><label for="s1">Full&nbsp;Search:</label></td>
              <td><input class="q" name="q" id="s1" tabindex="1"></td>
            </tr>
            <tr>
              <td><label for="s2">RegExp(filter):</label></td>
              <td><input class="q" name="r" id="s2" tabindex="2"></td>
            </tr>
          </table>
        </div>
        <div id="ptbl">
          <select size="4" class="q" id="project" name="project" ondblclick="goFirstProject();">
<!--%lua%
for k, v in pairs(projects) do
  print("            <option value=\"" .. k .. "\">" .. k .. "</option>\n")
end
%lua%-->
          </select>
        </div>
        <p>
          <input class="submit" type="submit" value="Search" tabindex="9">
          <input class="submit" type="button" value="Clear" onclick="clearForm()" tabindex="10">
        </p>
      </form>
    </div>
    <div id="results"></div>
    <div id="footer">
<!--%lua%
print("      <p><a href=\"" .. githubUrl .. "\" title=\"Served by " .. serverName .. "\"><span id=\"fti\"></span></a></p>\n")
print("      <p>Indexes created " .. indexCreationTime .. "</p>\n")
%lua%-->
    </div>
  </div>
</body>
</html>
